name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
  uses: actions/setup-node@v6
  with:
    node-version: lts/*
    cache: npm
    cache-dependency-path: luxe-glow-salon/package-lock.json

      - name: Install dependencies
        working-directory: luxe-glow-salon
        run: npm ci

      - name: Build
        working-directory: luxe-glow-salon
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./luxe-glow-salon/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4